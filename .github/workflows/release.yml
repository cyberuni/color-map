name: release
on:
  push:
    branches: [main]

jobs:
  code:
    uses: cyberuni/.github/.github/workflows/pnpm-verify.yml@main
    with:
      os: '["ubuntu-latest"]'
      skip-playwright: true
      skip-codecov: true

  release:
    uses: cyberuni/.github/.github/workflows/pnpm-release-semantic-oidc.yml@main
    needs: code
    # Declaring `permissions:` replaces the default, so every scope the callee needs must
    # be listed here — unlisted ones drop to `none`, not to the default.
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
