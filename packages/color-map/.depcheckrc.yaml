parsers:
  "**/*.cjs": "es6"
  "**/*.mjs": "es6"
  "**/*.ts": "typescript"
ignores:
  # Resolved by name from config rather than imported, so depcheck cannot see them.
  - "@repobuddy/jest"
  - "@types/jest"
  - "@types/node"
  - jest-*
  - ts-jest
  # Used only as a bin in package.json scripts (clean, nuke).
  - rimraf
