parsers:
  "**/*.cjs": "es6"
  "**/*.mjs": "es6"
  "**/*.ts": "typescript"
ignores:
  # Resolved by name from config rather than imported, so depcheck cannot see them.
  - "@types/node"
  - "@vitest/coverage-v8"
  # Used only as a bin in package.json scripts (clean, nuke).
  - rimraf
  # The size-limit plugin; size-limit loads it from the "size-limit" config in package.json.
  - "@size-limit/preset-small-lib"
