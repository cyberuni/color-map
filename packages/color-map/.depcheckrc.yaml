parsers:
  "**/*.cjs": "es6"
  "**/*.mjs": "es6"
  "**/*.ts": "typescript"
ignores:
  # Used only as a bin in package.json scripts (clean, nuke), which depcheck does
  # not resolve — same reason ts-loader and webpack-cli are listed below.
  - rimraf
  - "@commitlint/*"
  - "@repobuddy/jest"
  - "@size-limit/preset-small-lib"
  - "@types/node"
  - "@types/jest"
  - jest-*
  - ts-jest
  - ts-loader
  - tslib
  - webpack-cli
